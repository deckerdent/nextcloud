name: Deploy Resources
on:
  workflow_dispatch:
    inputs:
      location:
        description:
          "Azure region for resource deployment (e.g. germanywestcentral,
          eastus, westeurope)"
        required: false
        default: "germanywestcentral"
      environment:
        description: "Deployment environment that defines your secrets (e.g. prod, staging)"
        required: false
        default: "prod"
      domainName:
        description: "Domain name to configure (e.g. contoso.com)"
        required: true
        type: string
      swagEmail:
        description: "Email address for Let's Encrypt certificate notifications"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }} # Safeguard to ensure this job only runs on manual trigger
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Azure CLI
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create App Registration for Nextcloud
        id: create_app
        run: |
          appId=$(az ad app create --display-name "NextcloudApp" --query appId -o tsv)
          echo "appId=$appId" >> $GITHUB_OUTPUT

      - name: Create Client Secret for App Registration
        id: create_secret
        run: |
          set -euo pipefail
          appId="${{ steps.create_app.outputs.appId }}"
          # wait for app registration to propagate
          tries=12
          found=false
          for i in $(seq 1 $tries); do
            if az ad app show --id "$appId" >/dev/null 2>&1; then
              echo "App found after $i attempt(s)"
              found=true
              break
            fi
            echo "Waiting for app registration to appear ($i/$tries)..."
            sleep 5
          done
          if [ "$found" = false ]; then
            echo "App registration not found after $tries attempts"
            exit 1
          fi
          secretTries=5
          for j in $(seq 1 $secretTries); do
            clientSecret=$(az ad app credential reset --id "$appId" --append --display-name "default" --years 2 --query password -o tsv 2>/dev/null || true)
            if [ -n "$clientSecret" ]; then
              echo "Client secret created after $j attempt(s)"
              echo "clientSecret=$clientSecret" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting for client secret to be created ($j/$secretTries)..."
            sleep 5
          done
          if [ -z "$clientSecret" ]; then
            echo "Failed to create client secret after $secretTries attempts"
            exit 1
          fi

      - name: Generate SSH Key Pair
        id: generate_ssh
        run: |
          ssh-keygen -t rsa -b 2048 -f ssh_key -N ""
          # Base64-encode keys to produce single-line outputs safe for passing
          base64 -w0 ssh_key > ssh_key.b64
          base64 -w0 ssh_key.pub > ssh_key_pub.b64
          ssh_priv_b64=$(cat ssh_key.b64)
          ssh_pub_b64=$(cat ssh_key_pub.b64)
          # mask the SSH key material so it cannot appear in logs
          echo "::add-mask::$ssh_priv_b64"
          echo "::add-mask::$ssh_pub_b64"
          echo "sshKeyDataPrivateB64=$ssh_priv_b64" >> $GITHUB_OUTPUT
          echo "sshKeyDataPublicB64=$ssh_pub_b64" >> $GITHUB_OUTPUT

      - name: Generate Random Passwords
        id: generate_passwords
        run: |
          dbPassword=$(openssl rand -base64 32)
          adminPassword=$(openssl rand -base64 32)
          redisPassword=$(openssl rand -base64 32)
          # mask generated secrets so they do not appear in logs
          echo "::add-mask::$dbPassword"
          echo "::add-mask::$adminPassword"
          echo "::add-mask::$redisPassword"
          echo "dbPassword=$dbPassword" >> $GITHUB_OUTPUT
          echo "adminPassword=$adminPassword" >> $GITHUB_OUTPUT
          echo "redisPassword=$redisPassword" >> $GITHUB_OUTPUT

      - name: Deploy Azure Resources
        id: deploy_run
        run: |
          set -euo pipefail
          cd cloud-init
          chmod +x deploy.sh
          SSH_PRIVATE_B64="${{ steps.generate_ssh.outputs.sshKeyDataPrivateB64 }}"
          SSH_PUBLIC_B64="${{ steps.generate_ssh.outputs.sshKeyDataPublicB64 }}"
          # decode base64 into variables preserving newlines for the script
          SSH_PRIVATE=$(printf '%s' "$SSH_PRIVATE_B64" | base64 --decode)
          SSH_PUBLIC=$(printf '%s' "$SSH_PUBLIC_B64" | base64 --decode)
          DB_PW="${{ steps.generate_passwords.outputs.dbPassword }}"
          ADMIN_PW="${{ steps.generate_passwords.outputs.adminPassword }}"
          REDIS_PW="${{ steps.generate_passwords.outputs.redisPassword }}"
          CLIENT_ID="${{ steps.create_app.outputs.appId }}"
          CLIENT_SECRET="${{ steps.create_secret.outputs.clientSecret }}"
          DOMAIN_NAME="${{ github.event.inputs.domainName }}"

          # run deploy.sh and capture raw stdout (suppress stderr)
          deploy_output_raw=$(./deploy.sh \
            --location "${{ github.event.inputs.location }}" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --ssh-private "$SSH_PRIVATE" \
            --ssh-public "$SSH_PUBLIC" \
            --db-password "$DB_PW" \
            --admin-password "$ADMIN_PW" \
            --redis-password "$REDIS_PW" \
            --domainName "$DOMAIN_NAME" 2>/dev/null || true)

          # extract the last base64-like token from the output (robust against extra text)
          deploy_b64=$(printf '%s' "$deploy_output_raw" | grep -oE '[A-Za-z0-9+/=]{20,}' | tail -n1 || true)

          if [ -z "$deploy_b64" ]; then
            echo "No deploy result b64 available" >&2
            echo "Raw output:" >&2
            printf '%s\n' "$deploy_output_raw" >&2
            exit 1
          fi

          # expose as step output (use multiline-safe file command)
          echo "deploy_result_b64<<EOF" >> $GITHUB_OUTPUT
          # ensure a trailing newline so the closing EOF is on its own line
          printf '%s\n' "$deploy_b64" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Collect Bicep outputs
        id: collect_deploy
        run: |
          set -euo pipefail
          deploy_b64="${{ steps.deploy_run.outputs.deploy_result_b64 }}"
          if [ -z "$deploy_b64" ]; then
            echo "No deploy result b64 available" >&2
            exit 1
          fi
          decoded=$(printf '%s' "$deploy_b64" | base64 --decode)
          deploymentId=$(printf '%s' "$decoded" | sed -n 's/.*"deploymentId":"\([^"]*\)".*/\1/p')
          rgId=$(printf '%s' "$decoded" | sed -n 's/.*"resourceGroupId":"\([^"]*\)".*/\1/p')
          staticIp=$(printf '%s' "$decoded" | sed -n 's/.*"publicStaticIp":"\([^"]*\)".*/\1/p')
          keyVaultName=$(printf '%s' "$decoded" | sed -n 's/.*"keyVaultName":"\([^"]*\)".*/\1/p')
          keyVaultId=$(printf '%s' "$decoded" | sed -n 's/.*"keyVaultId":"\([^"]*\)".*/\1/p')

          echo "bicep finished deployment $deploymentId."
          echo "bicep deployed resource group $rgId."
          echo "bicep deployed static ip $staticIp and points it to the vm."
          echo "bicep created Key Vault $keyVaultName (id: $keyVaultId)"

          echo "deploymentId=$deploymentId" >> $GITHUB_OUTPUT
          echo "rgId=$rgId" >> $GITHUB_OUTPUT
          echo "publicStaticIp=$staticIp" >> $GITHUB_OUTPUT
          echo "keyVaultName=$keyVaultName" >> $GITHUB_OUTPUT
          echo "keyVaultId=$keyVaultId" >> $GITHUB_OUTPUT

      - name: Verify DNS and VM connectivity
        id: verify_dns
        run: |
          set -euo pipefail
          rgId="${{ steps.collect_deploy.outputs.rgId }}"
          domain="${{ github.event.inputs.domainName }}"
          public_ip="${{ steps.collect_deploy.outputs.publicStaticIp }}"

          # extract resource group name from id
          rg_name="${rgId##*/}"

          echo "Checking DNS zone in resource group: $rg_name"
          # get nameservers (first one)
          ns_list=$(az network dns zone show --resource-group "$rg_name" --name "$domain" --query "nameServers" -o tsv)
          echo "Azure DNS nameservers: $ns_list"
          # Store as newline-safe output for use in the summary step
          echo "nameservers<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$ns_list" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          ns1=$(printf '%s' "$ns_list" | head -n1)
          echo "Querying nameserver $ns1 for www.$domain"
          nslookup "www.$domain" "$ns1" || echo "nslookup failed"

          # prepare SSH key (decode but do not print)
          ssh_priv_b64="${{ steps.generate_ssh.outputs.sshKeyDataPrivateB64 }}"
          printf '%s' "$ssh_priv_b64" | base64 --decode > private_key.pem
          chmod 600 private_key.pem

          # test SSH reachability
          ssh_user="vm-admin-nextcloud"
          echo "Testing SSH to $public_ip as $ssh_user (timeout 10s)"
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i private_key.pem ${ssh_user}@${public_ip} 'echo SSH_OK' 2>/dev/null; then
            echo "SSH reachable"
          else
            echo "SSH not reachable"
          fi

      - name: Prepare deployment staging
        run: |
          set -euo pipefail
          rgId="${{ steps.collect_deploy.outputs.rgId }}"
          domain="${{ github.event.inputs.domainName }}"
          keyVaultName="${{ steps.collect_deploy.outputs.keyVaultName }}"
          ssh_priv_b64="${{ steps.generate_ssh.outputs.sshKeyDataPrivateB64 }}"

          STAGE="nc-deploy-staging"
          mkdir -p "$STAGE"

          # Copy deployment tree, excluding raw templates (those get rendered below)
          rsync -a --exclude='opt/nextcloud/templates' deployment/ "$STAGE/"

          # azure.ini: substitute AZURE_RESOURCE_GROUP (may contain slashes) and PRIMARY_DOMAIN
          mkdir -p "$STAGE/opt/nextcloud/config/swag/config/dns-conf"
          awk -v rg="$rgId" -v domain="$domain" '{
            gsub(/\$!{{AZURE_RESOURCE_GROUP}}/, rg)
            gsub(/\$!{{PRIMARY_DOMAIN}}/, domain)
            print
          }' deployment/opt/nextcloud/templates/azure.ini \
            > "$STAGE/opt/nextcloud/config/swag/config/dns-conf/azure.ini"

          # .env: substitute PRIMARY_DOMAIN and SWAG_EMAIL
          swagEmail="${{ github.event.inputs.swagEmail }}"
          sed 's|\$!{{PRIMARY_DOMAIN}}|'"$domain"'|g; s|\$!{{SWAG_EMAIL}}|'"$swagEmail"'|g' \
            deployment/opt/nextcloud/templates/.env.example \
            > "$STAGE/opt/nextcloud/.env"

          # SWAG proxy conf (no substitutions needed)
          mkdir -p "$STAGE/opt/nextcloud/config/swag/config/nginx/proxy-confs"
          cp deployment/opt/nextcloud/templates/nextcloud.subfolder.conf \
            "$STAGE/opt/nextcloud/config/swag/config/nginx/proxy-confs/nextcloud.subfolder.conf"

          # Key Vault name
          mkdir -p "$STAGE/etc/keyvault"
          printf '%s' "$keyVaultName" > "$STAGE/etc/keyvault/.keyvaultname"

          # Decode SSH private key and mask it before storing in GITHUB_ENV
          ssh_private=$(printf '%s' "$ssh_priv_b64" | base64 --decode)
          echo "::add-mask::$ssh_private"
          {
            echo "SSH_PRIVATE_KEY<<EOF"
            printf '%s\n' "$ssh_private"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.collect_deploy.outputs.publicStaticIp }}
          username: vm-admin-nextcloud
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: "nc-deploy-staging"
          target: "/tmp/nc-deploy"
          strip_components: 1 # strips "nc-deploy-staging/" so target gets opt/..., etc/...

      - name: Apply files and start service on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.collect_deploy.outputs.publicStaticIp }}
          username: vm-admin-nextcloud
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/nextcloud /opt/nextcloud/config/swag/config/dns-conf \
              /opt/nextcloud/config/swag/config/nginx/proxy-confs /etc/keyvault /etc/systemd/system
            # Incrementally merge staged files into their final destinations
            sudo rsync -a /tmp/nc-deploy/ /
            sudo rm -rf /tmp/nc-deploy
            sudo chmod +x /opt/nextcloud/start.sh
            sudo systemctl daemon-reload
            sudo systemctl enable --now nextcloud.service
            sudo systemctl status nextcloud.service --no-pager || true

      - name: Configure user_oidc on Nextcloud
        uses: appleboy/ssh-action@v1.0.3
        env:
          OIDC_CLIENT_ID: ${{ steps.create_app.outputs.appId }}
          OIDC_CLIENT_SECRET: ${{ steps.create_secret.outputs.clientSecret }}
          OIDC_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          host: ${{ steps.collect_deploy.outputs.publicStaticIp }}
          username: vm-admin-nextcloud
          key: ${{ env.SSH_PRIVATE_KEY }}
          envs: OIDC_CLIENT_ID,OIDC_CLIENT_SECRET,OIDC_TENANT_ID
          command_timeout: 15m
          script: |
            set -euo pipefail

            # ── Wait for Nextcloud to finish initializing ────────────────────────
            echo "Waiting for Nextcloud to be ready..."
            max_tries=100
            for i in $(seq 1 $max_tries); do
              if docker exec --user www-data nextcloud php occ status 2>/dev/null | grep -q 'installed: true'; then
                echo "Nextcloud ready after $i attempt(s)"
                break
              fi
              if [ "$i" = "$max_tries" ]; then
                echo "Nextcloud did not become ready after $((max_tries * 10))s" >&2
                docker logs nextcloud --tail 50 >&2 || true
                exit 1
              fi
              echo "Not ready yet ($i/$max_tries), retrying in 10s..."
              sleep 10
            done

            # ── Install / enable user_oidc ───────────────────────────────────────
            echo "Installing user_oidc app..."
            docker exec --user www-data nextcloud php occ app:install user_oidc 2>/dev/null \
              || docker exec --user www-data nextcloud php occ app:enable user_oidc

            # ── Register (or update) the Azure AD OIDC provider ─────────────────
            echo "Configuring user_oidc provider..."
            DISCOVERY_URI="https://login.microsoftonline.com/${OIDC_TENANT_ID}/v2.0/.well-known/openid-configuration"

            # Register or update the provider (per-provider settings only)
            docker exec --user www-data nextcloud \
              php occ user_oidc:provider "EntraID" \
                --clientid="$OIDC_CLIENT_ID" \
                --clientsecret="$OIDC_CLIENT_SECRET" \
                --discoveryuri="$DISCOVERY_URI" \
                --scope="openid email profile" \
                --unique-uid=1

            # Global user_oidc system config (these live in config.php, not per-provider)
            # auto_provision=true + soft_auto_provision=true + disable_account_creation=true:
            # → user_oidc updates user info from the IdP but does NOT create new accounts
            docker exec --user www-data nextcloud php occ config:system:set user_oidc auto_provision --value=true --type=boolean
            docker exec --user www-data nextcloud php occ config:system:set user_oidc soft_auto_provision --value=true --type=boolean
            docker exec --user www-data nextcloud php occ config:system:set user_oidc disable_account_creation --value=true --type=boolean
            # userinfo_bearer_validation: validate API bearer tokens against the userinfo endpoint
            docker exec --user www-data nextcloud php occ config:system:set user_oidc userinfo_bearer_validation --value=true --type=boolean

            echo "user_oidc configured successfully"

      - name: Deployment summary
        if: always()
        run: |
          domain="${{ github.event.inputs.domainName }}"
          rgId="${{ steps.collect_deploy.outputs.rgId }}"
          kvName="${{ steps.collect_deploy.outputs.keyVaultName }}"
          staticIp="${{ steps.collect_deploy.outputs.publicStaticIp }}"
          nameservers="${{ steps.verify_dns.outputs.nameservers }}"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Deployment complete

          **Resource group:** \`${rgId}\`
          **Static IP:** \`${staticIp}\`
          **Key Vault:** \`${kvName}\`
          **Domain:** \`${domain}\`

          ---

          ### Key Vault access
          > **Your user account does not have the _Key Vault Secrets User_ role yet.**
          > Only the VM's managed identity can read secrets right now.
          > To grant yourself access, go to **Key Vault → Access control (IAM)** in the Azure Portal
          > and assign yourself the _Key Vault Secrets User_ role on \`${kvName}\`.

          ---

          ### DNS configuration
          Your Azure DNS zone for \`${domain}\` has been created and an A record pointing to \`${staticIp}\` has been provisioned by the Bicep deployment.

          The only remaining step is to **delegate to Azure DNS** at your domain registrar:
          In your registrar's control panel, replace the current NS records for \`${domain}\` with these four Azure nameservers:

          \`\`\`
          ${nameservers}
          \`\`\`

          Once the NS records propagate (minutes to hours depending on your registrar), SWAG will automatically
          obtain a Let's Encrypt certificate via the Azure DNS challenge plugin on next startup.

          ---

          ### First login
          Nextcloud is protected by Entra ID but **does not auto-provision accounts**.

          1. SSH into the VM and retrieve the admin credentials from Key Vault \`${kvName}\`,
             secrets \`nextcloud-admin-username\` and \`nextcloud-admin-password\`.
          2. Log in at \`https://${domain}/nextcloud\` with those credentials.
          3. Create a Nextcloud user for yourself (same username as your Entra UPN is recommended).
          4. Log out, then use the **Login with Microsoft** button — your Entra identity will be
             linked to the account you just created.

          > **Other users:** create their Nextcloud account first, then have them log in via Microsoft.
          > They must exist in your Entra tenant.
          >
          > If you want to allow **guest users or personal Microsoft accounts** without managing them
          > in your tenant, change the discovery URI in Nextcloud's _OpenID Connect_ admin settings
          > from \`${OIDC_TENANT_ID}\` to \`common\`.
          > You will still need to manually create each user in Nextcloud before their first login.
          EOF
